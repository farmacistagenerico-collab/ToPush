name: Deploy FarmaCromia su GitHub Pages

# Costruisce il frontend Vite e lo pubblica su GitHub Pages.
#
# PREREQUISITO (una tantum, da fare nelle impostazioni del repository):
#   Settings -> Pages -> "Build and deployment" -> Source: **GitHub Actions**
#
# Finché la source resta su "Deploy from a branch", GitHub serve i FILE SORGENTE
# (index.html con <script src="/src/main.tsx">) invece della build: è esattamente
# il motivo per cui il sito risultava completamente bianco.

on:
  push:
    branches: [main]
  # Permette di rilanciare il deploy a mano dalla scheda Actions.
  workflow_dispatch:

# Consente a GITHUB_TOKEN di pubblicare su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annullare quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 include npm 11: con npm 10.8.x l'install si schianta
          # ("Cannot read properties of null (reading 'edgesOut')").
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # `--mode pages` carica .env.pages, che imposta VITE_STATIC_MODE=true:
      # il livello dati passa in-browser (localStorage + BroadcastChannel),
      # perché su GitHub Pages non esiste alcun backend Express raggiungibile.
      # Gli asset restano relativi (base './' in vite.config.ts), quindi il sito
      # funziona sotto /ToPush/ e anche se il repository viene rinominato.
      - name: Build (modalità statica)
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
