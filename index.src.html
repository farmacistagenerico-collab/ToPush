<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FarmaCromia</title>
    <!-- Path relativo: con base './' funziona sia su /ToPush/ sia in locale.
         Senza questo link il browser richiede /favicon.ico alla root del dominio -> 404. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#059669" />
    <!-- PWA: installabile e usabile offline al banco -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FarmaCromia" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="description" content="Sistema di consiglio e gestione giacenze a semaforo cromatico per farmacie. Semplifica il cross-selling e gli obiettivi del banco senza pressione numerica per i collaboratori." />
    <meta property="og:title" content="FarmaCromia" />
    <meta property="og:description" content="Sistema di consiglio e gestione giacenze a semaforo cromatico per farmacie. Semplifica il cross-selling e gli obiettivi del banco senza pressione numerica per i collaboratori." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // PWA: registra il service worker (offline + installabilità).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('./sw.js')
            .catch(function (err) {
              console.warn('[FarmaCromia] Service worker non registrato:', err);
            });
        });
      }
    </script>
  </body>
</html>
